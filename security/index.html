<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Безопасность ювелирного салона — интерактивное обучение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Manrope:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2430; --ivory:#F6F3EE; --paper:#FFFDF9; --line:#E2DCD2;
  --amber:#B35C14; --amber-l:#E8A15C; --blue:#2F5D8A; --sky:#DCE6EF; --muted:#5E6470;
  --ok:#2E6B4F; --ok-bg:#E6F1EA; --bad:#9B3B2E; --bad-bg:#F6E4E0;
  --hf:'Manrope','Inter',system-ui,sans-serif; --bf:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--bf);background:var(--ivory);color:var(--ink);font-size:17px;line-height:1.55}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--hf);line-height:1.15;margin:0}
p{margin:0}

/* ---------- layout ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--ivory);padding:14px 24px;display:flex;align-items:center;gap:20px}
.top .brand{font-family:var(--hf);font-weight:700;font-size:17px;white-space:nowrap}
.top .brand small{display:block;font-family:var(--bf);font-weight:400;font-size:12px;color:#B9BCC4;letter-spacing:.5px}
.prog{flex:1;display:flex;align-items:center;gap:12px;min-width:120px}
.bar{flex:1;height:8px;background:#3A4050;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber-l);transition:width .5s}
.prog span{font-size:13px;color:#D9DBE0;white-space:nowrap}
.pts{display:flex;align-items:center;gap:6px;background:#2C3242;border-radius:20px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap;position:relative}
.pts .st{color:var(--amber-l)}
.pts.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.menu-btn{display:none;background:none;border:1px solid #4A5060;color:var(--ivory);border-radius:8px;padding:6px 12px}
.wrap{display:flex;max-width:1280px;margin:0 auto}
nav{width:290px;flex-shrink:0;padding:24px 16px;position:sticky;top:64px;align-self:flex-start;max-height:calc(100vh - 64px);overflow:auto}
nav button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:10px 12px;color:var(--ink);font-size:15px;line-height:1.35}
nav button:hover{background:#EDE8E0}
nav button.cur{background:var(--paper);box-shadow:0 0 0 1px var(--line)}
nav .n{flex-shrink:0;width:26px;height:26px;border-radius:13px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
nav button.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
nav button.cur .n{border-color:var(--amber)}
main{flex:1;min-width:0;padding:32px 32px 80px}
.mod{max-width:840px;animation:fadeUp .45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mhead{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:center;margin-bottom:28px}
.mhead .ill{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:10px}
.ill svg{display:block;width:100%;height:auto}
.kicker{font-size:13px;font-weight:700;letter-spacing:2.5px;color:var(--amber);text-transform:uppercase;margin-bottom:10px}
.mhead h2{font-size:38px;margin-bottom:12px}
.lead{font-size:19px;color:#3A4050}
.block{margin:0 0 28px}
.block>h3{font-size:22px;margin-bottom:14px}

/* ---------- content blocks ---------- */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.steps li{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;opacity:0;transform:translateX(-10px);animation:slideIn .4s ease forwards}
@keyframes slideIn{to{opacity:1;transform:none}}
.steps .num{flex-shrink:0;width:30px;height:30px;border-radius:15px;background:var(--ink);color:var(--ivory);font-family:var(--hf);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:12px;padding:20px 22px;transition:transform .2s, box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(31,36,48,.08)}
.card.a{border-top-color:var(--amber)}
.card h4{font-family:var(--hf);font-size:18px;margin:0 0 8px;color:var(--blue)}
.card.a h4{color:var(--amber)}
.card ul{margin:0;padding-left:20px}
.card li{margin:4px 0}
.callout{background:var(--paper);border-left:6px solid var(--amber);border-radius:8px;padding:16px 20px}
.callout b{color:var(--amber)}
.callout a,.status a{color:var(--blue);font-weight:600}
.script{font-style:italic}
.statement{background:var(--ink);color:var(--ivory);border-radius:16px;padding:32px;display:grid;grid-template-columns:1fr 150px;gap:24px;align-items:center}
.statement h3{font-size:28px;margin-bottom:10px}
.statement p{color:#D9DBE0}
details.more{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
details.more summary{cursor:pointer;font-weight:600;color:var(--blue)}
details.more div{margin-top:10px}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.flip{perspective:900px;height:190px;background:none;border:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.flip .f{background:var(--paper);border:1px solid var(--line)}
.flip .f .ic{font-size:34px}
.flip .f h4{font-family:var(--hf);font-size:18px;margin:0}
.flip .f small{color:var(--muted);font-size:13px}
.flip .b{background:var(--blue);color:#fff;transform:rotateY(180deg);font-size:15px;line-height:1.45;justify-content:center}

/* ---------- tasks ---------- */
.task{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:24px;margin:0 0 28px;position:relative}
.task.solved{border-color:var(--ok)}
.task .tl{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.task .tl em{font-style:normal;color:var(--amber)}
.task .q{font-family:var(--hf);font-weight:700;font-size:20px;margin-bottom:6px}
.task .hint{font-size:14px;color:var(--muted);margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--ivory);border:2px solid transparent;border-radius:10px;padding:12px 16px;color:var(--ink);transition:border-color .15s, transform .15s}
.opt:hover:not([disabled]){border-color:var(--line);transform:translateX(3px)}
.opt .box{flex-shrink:0;width:22px;height:22px;border-radius:6px;border:2px solid #9AA0AA;margin-top:2px}
.opt.radio .box{border-radius:11px}
.opt.sel{border-color:var(--blue)}
.opt.sel .box{background:var(--blue);border-color:var(--blue)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);animation:shake .4s}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt[disabled]{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.row{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--ivory);border:none;border-radius:10px;padding:12px 22px;font-weight:600;transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--ink)}
.btn.amber{background:var(--amber)}
.btn.sm{padding:8px 14px;font-size:15px}
.fb{margin-top:16px;border-radius:10px;padding:14px 18px;display:none}
.fb.show{display:block;animation:fadeUp .3s}
.fb.ok{background:var(--ok-bg);color:#1E4A36}
.fb.no{background:var(--bad-bg);color:#6E2A20}
.fb b{display:block;margin-bottom:4px}
/* ordering */
.pool,.placed{display:grid;gap:8px}
.placed{margin-bottom:14px;min-height:20px}
.placed .it{background:#EEF3F8;border-color:var(--blue)}
.it{display:flex;gap:12px;align-items:center;text-align:left;background:var(--ivory);border:2px solid transparent;border-radius:10px;padding:10px 14px;color:var(--ink);animation:fadeUp .25s}
.it .k{flex-shrink:0;width:26px;height:26px;border-radius:13px;background:var(--blue);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pool .it .k{background:#C9CDD4}
.it.right{background:var(--ok-bg);border-color:var(--ok)}
.it.wrong{background:var(--bad-bg);border-color:var(--bad)}
.sub{font-size:13px;color:var(--muted);margin:4px 0 8px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
/* sort / true-false */
.srt{display:grid;gap:10px}
.srt .itm{background:var(--ivory);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;transition:background .2s}
.srt .itm.r{background:var(--ok-bg)} .srt .itm.w{background:var(--bad-bg)}
.srt .itm .ex{grid-column:1/-1;font-size:14px;color:#3A4050;display:none}
.srt .itm.r .ex,.srt .itm.w .ex{display:block;animation:fadeUp .3s}
.srt .ch{display:flex;gap:8px}
.srt .ch button{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.srt .ch button.pick{background:var(--ink);color:#fff}
.srt .ch button[disabled]{cursor:default;opacity:.85}
/* spot the violations */
.scene{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);user-select:none}
.scene svg{display:block;width:100%;height:auto}
.scene .hs{cursor:pointer}
.scene .dec{cursor:pointer}
.found-ring{fill:none;stroke:#B35C14;stroke-width:5;animation:ringIn .45s ease}
@keyframes ringIn{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
.found-ring,.found-n{transform-box:fill-box;transform-origin:center}
.found-n{font:700 20px var(--hf);fill:#fff}
.found-b{fill:#B35C14}
.spotlist{display:grid;gap:8px;margin-top:14px;counter-reset:s}
.spotlist div{background:var(--ok-bg);border-radius:8px;padding:8px 12px;font-size:15px;animation:fadeUp .3s}
.spotlist div.miss{background:var(--bad-bg)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;opacity:0;transition:all .3s;z-index:50;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.plus{position:fixed;z-index:60;font:800 22px var(--hf);color:var(--amber);pointer-events:none;animation:plusUp 1.1s ease forwards}
@keyframes plusUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
/* scenario */
.scn .story{background:var(--ivory);border-radius:12px;padding:16px 18px;margin-bottom:14px;animation:fadeUp .35s}
.scn .story .who{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.scn .log{display:grid;gap:8px;margin-bottom:14px}
.scn .log div{font-size:15px;padding:8px 12px;border-left:4px solid var(--ok);background:var(--ok-bg);border-radius:6px}
.dots{display:flex;gap:6px;margin-bottom:12px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--ok)} .dots i.c{background:var(--amber)}
/* kts trainer */
.kts{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center}
.fobbtn{background:none;border:none;padding:0;width:100%}
.fobbtn svg{width:100%;height:auto;display:block}
.fobbtn:active .core{transform:scale(.9)}
.core{transform-box:fill-box;transform-origin:center;transition:transform .1s}
.wave{fill:none;stroke:#B35C14;stroke-width:4;stroke-linecap:round;opacity:0}
.kts.go .wave{animation:wv 1.2s ease-out 3}
.kts.go .wave.w2{animation-delay:.2s}.kts.go .wave.w3{animation-delay:.4s}
@keyframes wv{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.led{fill:#5b1f18}
.kts.go .led{fill:#E5483A;animation:blink .4s 6}
.tline{display:grid;gap:10px}
.tline div{display:flex;gap:12px;align-items:center;opacity:.3;transition:opacity .4s}
.tline div.on{opacity:1}
.tline span.k{width:30px;height:30px;flex-shrink:0;border-radius:15px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
/* checklist */
.chk{display:grid;grid-template-columns:1fr 240px;gap:24px;align-items:start}
.chk label{display:flex;gap:12px;align-items:flex-start;background:var(--ivory);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:background .2s}
.chk label.on{background:var(--ok-bg)}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex-shrink:0}
#shutter{transition:transform .6s ease}

.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.status{font-size:14px;color:var(--muted);margin-top:10px}

/* start + final */
.hero{background:var(--ink);color:var(--ivory);border-radius:20px;padding:40px;display:grid;grid-template-columns:1fr 280px;gap:24px;align-items:center}
.hero h1{font-size:44px;margin:6px 0 16px}
.hero p{color:#D9DBE0;font-size:18px}
.hero .kicker{color:var(--amber-l)}
.field{display:grid;gap:6px;margin-top:18px}
.field label{font-size:14px;font-weight:600}
.ferr{color:var(--bad);font-size:13px;min-height:0}
.fhint{color:var(--muted);font-size:13px}
.field select{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;max-width:420px}
.field input:disabled{background:#EEE}
.field input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;max-width:420px}
.brands{display:flex;gap:10px;flex-wrap:wrap}
.brands button{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 18px;font-weight:600}
.brands button.sel{border-color:var(--amber);background:#FBEFE3}
.meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:24px}
.meta div b{display:block;font-family:var(--hf);font-size:26px;color:var(--amber-l)}
.meta div{font-size:14px;color:#D9DBE0}
.score{font-family:var(--hf);font-size:64px;font-weight:800}
.cert{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:40px;text-align:center}
.cert h3{font-size:30px;margin:10px 0}
.cert .who{font-family:var(--hf);font-size:28px;font-weight:700;margin:16px 0 4px}
.cert .ill{max-width:220px;margin:0 auto}
.review{display:grid;gap:12px;margin-top:18px}
.review .r{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--bad);border-radius:10px;padding:14px 18px}
.review .r small{display:block;color:var(--muted)}
.timer{font-family:var(--hf);font-weight:700;color:var(--muted);font-size:15px}

/* ---------- illustration animations ---------- */
.a-float{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.a-pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite;opacity:0}
.a-pulse.d2{animation-delay:1.3s}
@keyframes pulse{0%{opacity:.55;transform:scale(.85)}100%{opacity:0;transform:scale(1.6)}}
.a-draw{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 3.2s ease infinite}
@keyframes draw{0%{stroke-dashoffset:120}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.a-blink{animation:blink 1.4s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.a-shutter{animation:shut 6s ease-in-out infinite}
@keyframes shut{0%,15%{transform:translateY(0)}45%,75%{transform:translateY(-118px)}100%{transform:translateY(0)}}
.a-sun{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.a-wave{opacity:0;animation:wv 1.8s ease-out infinite}
.a-wave.d2{animation-delay:.3s}.a-wave.d3{animation-delay:.6s}
.a-pop{transform-box:fill-box;transform-origin:center;animation:pop 6s ease infinite;opacity:0}
.a-pop.d2{animation-delay:.6s}.a-pop.d3{animation-delay:1.2s}
@keyframes pop{0%{opacity:0;transform:scale(.3)}8%,70%{opacity:1;transform:scale(1)}80%,100%{opacity:0;transform:scale(.3)}}
.a-note{animation:note 4s ease-in-out infinite}
@keyframes note{0%{transform:translateX(-120px)}40%,70%{transform:translateX(0)}100%{transform:translateX(0);opacity:0}}
.a-scan{animation:scan 2s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(110px)}}
.a-look{animation:look 5s ease-in-out infinite}
@keyframes look{0%,10%{transform:translateX(0)}25%,40%{transform:translateX(-16px)}55%,70%{transform:translateX(16px)}85%,100%{transform:translateX(0)}}
.a-lid{transform-box:fill-box;transform-origin:center;animation:lid 5s ease-in-out infinite}
@keyframes lid{0%,8%,92%,100%{transform:scaleY(1)}4%{transform:scaleY(.1)}}
.a-shake{transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-in-out infinite}
@keyframes ring{0%,50%,100%{transform:rotate(0)}5%,15%,25%{transform:rotate(-8deg)}10%,20%,30%{transform:rotate(8deg)}}
.a-arrow{animation:arr 1.6s ease-in-out infinite}
@keyframes arr{0%{transform:translateX(-10px);opacity:0}30%,70%{opacity:1}100%{transform:translateX(24px);opacity:0}}
.a-bob{animation:float 3s ease-in-out infinite}
.a-dial{transform-box:fill-box;transform-origin:center;animation:dial 5s ease-in-out infinite}
@keyframes dial{0%{transform:rotate(0)}30%{transform:rotate(200deg)}55%{transform:rotate(80deg)}80%,100%{transform:rotate(300deg)}}
.a-tw{animation:tw 2.4s ease-in-out infinite}
.a-tw.d2{animation-delay:.8s}.a-tw.d3{animation-delay:1.6s}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.a-cam{transform-box:fill-box;transform-origin:15% 50%;animation:cam 6s ease-in-out infinite}
@keyframes cam{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg)}}
.a-beam{transform-box:fill-box;transform-origin:0% 50%;animation:cam 6s ease-in-out infinite}
.a-spark{transform-box:fill-box;transform-origin:center;animation:spark 2.2s ease-in-out infinite}
.a-spark.d2{animation-delay:.7s}.a-spark.d3{animation-delay:1.4s}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.a-pulse,.a-pop,.a-wave,.steps li{opacity:1}}

@media (max-width:900px){
  nav{position:fixed;top:56px;left:0;bottom:0;background:var(--ivory);z-index:15;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.08);max-height:none}
  nav.open{transform:none}
  .menu-btn{display:block}
  main{padding:22px 16px 60px}
  .cols,.mhead,.hero,.kts,.chk,.statement{grid-template-columns:1fr}
  .mhead .ill{max-width:340px}
  .mhead h2{font-size:30px}
  .hero{padding:28px}.hero h1{font-size:32px}
  .top{padding:12px 14px;gap:12px}
  .top .brand{font-size:15px}
  .top .brand small{display:none}
  .prog{min-width:40px}
  .prog span{display:none}
  .srt .itm{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="Меню">☰</button>
  <div class="brand">Безопасность салона<small>Соколов · МЮЗ · Сенат · Пламенея</small></div>
  <div class="prog"><div class="bar"><i id="barFill"></i></div><span id="progTxt">0%</span></div>
  <div class="pts" id="pts" title="Баллы за верные ответы"><span class="st">★</span><span id="ptsN">0</span></div>
</header>
<div class="wrap">
  <nav id="nav"></nav>

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function award(id, n, anchor){
  if (S.tasks[id] && S.tasks[id].awarded) return;
  S.tasks[id] = Object.assign(S.tasks[id]||{}, {awarded:true});
  if (n<=0) return;
  S.pts += n; save();
  $('#ptsN').textContent = S.pts;
  const p = $('#pts'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump');
  if (anchor){ const r = anchor.getBoundingClientRect(); const s = document.createElement('div'); s.className='plus'; s.textContent='+'+n;
    s.style.left = (r.left + r.width/2 - 20)+'px'; s.style.top = (r.top - 10)+'px'; document.body.appendChild(s); setTimeout(()=>s.remove(),1200); }
}
function complete(id, correct, extra, anchor, pts){
  const first = !(S.tasks[id] && S.tasks[id].done);
  S.tasks[id] = Object.assign(S.tasks[id]||{}, {done:true, correct}, extra||{});
  save();
  if (first) award(id, pts!=null?pts:(correct?10:3), anchor);
}

function tasksOf(m){ return m.blocks.filter(b=>TASK_TYPES.includes(b.t)).map(b=>b.id); }
function modDone(m){ return tasksOf(m).every(id => S.tasks[id] && S.tasks[id].done); }
function progress(){
  const total = MODULES.length + 1;
  const d = MODULES.filter(modDone).length + (S.final && S.final.passed ? 1 : 0);
  return Math.round(d/total*100);
}

    h += `<button data-v="${m.id}" class="${cls}"><span class="n">${modDone(m)?'✓':i+1}</span><span>${esc(m.title)}</span></button>`;
  });
  const fd = S.final && S.final.passed;
  h += `<button data-v="final" class="${S.view==='final'?'cur':''} ${fd?'done':''}"><span class="n">${fd?'✓':'★'}</span><span>Итоговый тест</span></button>`;
  $('#nav').innerHTML = h;
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.v));
  const p = progress();
  $('#barFill').style.width = p+'%'; $('#progTxt').textContent = p+'% пройдено';
  $('#ptsN').textContent = S.pts;
}
function go(v){
  S.view = v; save();
  if (location.hash.slice(1) !== v) { try{ history.replaceState(null,'','#'+v); }catch(e){ try{location.hash = v;}catch(_){} } }
  render(); $('#nav').classList.remove('open'); window.scrollTo(0,0);
}

}

  const parts = normName(s).split(' ').filter(Boolean);
  return parts.length >= 2 && parts.length <= 3 && parts.every(p => /^[А-ЯЁA-Z][а-яёa-z]+(-[А-ЯЁA-Z][а-яёa-z]+)?$/.test(p));
}
function normName(s){
  return String(s||'').replace(/\s+/g,' ').trim().split(' ').map(w => w.split('-').map(p => p ? p[0].toUpperCase()+p.slice(1).toLowerCase() : p).join('-')).join(' ');
}

/* ----- отправка результатов ----- */
function sendEvent(type, extra){
  if (!API_URL || !profileOk()) return;
  const payload = Object.assign({
    type, name: normName(S.name), brand: S.brand, salon: '', device: S.device,
    pts: S.pts, modules: MODULES.filter(modDone).length,
    tasks: Object.values(S.tasks).filter(t=>t.done).length, ts: Date.now()
  }, extra||{});
  S.queue = (S.queue||[]).concat([payload]); save();
  flushQueue();
}
function flushQueue(){
  if (!API_URL || !S.queue || !S.queue.length || flushQueue.busy) return;
  flushQueue.busy = true;
  const item = S.queue[0];
  fetch(API_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(item)})
    .then(() => { S.queue.shift(); save(); flushQueue.busy = false; flushQueue(); })
    .catch(() => { flushQueue.busy = false; setTimeout(flushQueue, 30000); });
}

function blockHTML(b){
  switch(b.t){
    case 'h': return `<div class="block"><h3>${esc(b.text)}</h3></div>`;
    case 'steps': return `<div class="block"><ol class="steps">${b.items.map((s,i)=>`<li style="animation-delay:${i*70}ms"><span class="num">${i+1}</span><span>${esc(s)}</span></li>`).join('')}</ol></div>`;
    case 'cards': return `<div class="block cards">${b.items.map(([t,d])=>`<div class="card ${b.accent||''}"><h4>${esc(t)}</h4><p>${esc(d)}</p></div>`).join('')}</div>`;
    case 'cols': return `<div class="block cols">${b.items.map(([t,list],i)=>`<div class="card ${i?'a':''}"><h4>${esc(t)}</h4><ul>${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
    case 'callout': return `<div class="block callout"><b>${esc(b.label||'')}</b> <span class="${b.cls||''}">${esc(b.text)}</span></div>`;
    case 'statement': return `<div class="block statement"><div><h3>${esc(b.title)}</h3><p>${esc(b.text)}</p></div><div class="ill">${ILL.statement}</div></div>`;
    case 'more': return `<div class="block"><details class="more"><summary>${esc(b.title)}</summary><div>${esc(b.text)}</div></details></div>`;
    case 'flips': return `<div class="block flips">${b.items.map(([ic,t,d])=>`<button class="flip"><div class="in"><div class="f"><span class="ic">${esc(ic)}</span><div><h4>${esc(t)}</h4><small>Нажмите, чтобы перевернуть</small></div></div><div class="b">${esc(d)}</div></div></button>`).join('')}</div>`;
    case 'kts': return `<div class="block task" id="kts"></div>`;
    case 'checklist': return `<div class="block task" id="chk"></div>`;
    default: return TASK_TYPES.includes(b.t) ? `<div class="task" id="t-${b.id}"></div>` : '';
  }
}

function renderModule(m){
  const prev = VIEWS[VIEWS.indexOf(m.id)-1], next = VIEWS[VIEWS.indexOf(m.id)+1];
  $('#main').innerHTML = `<div class="mod">
    <div class="mhead"><div><div class="kicker">${esc(m.kicker)} из ${MODULES.length}</div><h2>${esc(m.title)}</h2><p class="lead">${esc(m.lead)}</p></div><div class="ill">${ILL[m.id]||''}</div></div>
    ${m.blocks.map(blockHTML).join('')}
    <div class="navrow"><button class="btn ghost" id="prevBtn">← Назад</button><button class="btn" id="nextBtn">${next==='final'?'К итоговому тесту →':'Следующий модуль →'}</button></div>
    <p class="status" id="modStatus"></p></div>`;
  const mount = {quiz:mountQuiz, order:mountOrder, sort:mountSort, spot:mountSpot, scenario:mountScenario, kts:mountKts, checklist:mountChecklist};
  m.blocks.forEach(b => { if (mount[b.t]) mount[b.t](b, m); });
  document.querySelectorAll('.flip').forEach(f => f.onclick = () => f.classList.toggle('on'));
  $('#prevBtn').onclick = () => go(prev);
  $('#nextBtn').onclick = () => go(next);
  updStatus(m);
}
function updStatus(m){
  const ids = tasksOf(m), d = ids.filter(id=>S.tasks[id]&&S.tasks[id].done).length;
  const el = $('#modStatus'); if (!el) return;
  const was = el.dataset.done==='1';
  el.textContent = d===ids.length ? '✓ Модуль пройден' : `Выполнено заданий: ${d} из ${ids.length}. Модуль засчитывается, когда выполнены все.`;
  el.dataset.done = d===ids.length ? '1':'0';
  if (d===ids.length && !was && el.dataset.init) toast('Модуль «'+m.title+'» пройден!');
  if (d===ids.length && !was && el.dataset.init) sendEvent('progress');
  el.dataset.init = '1';
  renderNav();
}
const head = (label, id) => `<div class="tl"><span>${label}</span>${S.tasks[id]&&S.tasks[id].done?'<em>✓ выполнено</em>':'<em>+10 ★</em>'}</div>`;

/* ----- quiz ----- */
function mountQuiz(b, m){
  const el = $('#t-'+b.id);
  let sel = new Set();
  const multi = !!b.multi, okSet = new Set(multi ? b.ok : [b.ok]);
  function draw(answered, chosen){
    el.classList.toggle('solved', !!(S.tasks[b.id]&&S.tasks[b.id].done));
    el.innerHTML = `${head('Вопрос', b.id)}<div class="q">${esc(b.q)}</div>
      <div class="hint">${esc(b.hint || (multi?'Выберите все подходящие варианты':'Выберите один вариант'))}</div>
      <div class="opts">${b.opts.map((o,i)=>{
        let c = 'opt' + (multi?'':' radio');
        if (answered){ if (chosen.includes(i)) c += okSet.has(i)?' right':' wrong'; else if (okSet.has(i)) c += ' missed'; }
        else if (sel.has(i)) c += ' sel';
        return `<button class="${c}" data-i="${i}" ${answered?'disabled':''}><span class="box"></span><span>${esc(o)}</span></button>`;}).join('')}</div>
      <div class="row">${answered?'<button class="btn ghost sm" data-act="retry">Ответить ещё раз</button>':'<button class="btn" data-act="check" disabled>Проверить</button>'}</div>
      <div class="fb"></div>`;
    if (!answered){
      el.querySelectorAll('.opt').forEach(o => o.onclick = () => {
        const i = +o.dataset.i;
        if (multi){ sel.has(i)?sel.delete(i):sel.add(i); } else { sel = new Set([i]); }
        draw(false);
      });
      const cb = el.querySelector('[data-act=check]'); cb.disabled = sel.size===0;
      cb.onclick = () => {
        const chosen = [...sel];
        const correct = chosen.length===okSet.size && chosen.every(i=>okSet.has(i));
        complete(b.id, correct, {chosen}, cb);
        draw(true, chosen); fb(correct); updStatus(m);
      };
    } else el.querySelector('[data-act=retry]').onclick = () => { sel = new Set(); draw(false); };
  }
  function fb(correct){
    const f = el.querySelector('.fb'); f.className = 'fb show ' + (correct?'ok':'no');
    f.innerHTML = `<b>${correct?'Верно!':'Не совсем.'}</b>${esc(b.explain)}${correct?'':' Правильный вариант отмечен зелёной рамкой.'}`;
  }
  const st = S.tasks[b.id];
  if (st && st.done){ draw(true, st.chosen||[]); fb(st.correct); } else draw(false);
}

/* ----- ordering ----- */
function mountOrder(b, m){
  const el = $('#t-'+b.id);
  let placed = [], pool = shuffle(b.items.map((_,i)=>i));
  function draw(checked){
    el.classList.toggle('solved', !!(S.tasks[b.id]&&S.tasks[b.id].done));
    el.innerHTML = `${head('Порядок действий', b.id)}<div class="q">${esc(b.q)}</div>
      <div class="hint">Нажимайте на шаги по очереди — от первого к последнему. Нажмите на выбранный шаг, чтобы вернуть его.</div>
      <div class="sub">Ваш порядок</div>
      <div class="placed">${placed.length?placed.map((i,k)=>`<button class="it ${checked?(i===k?'right':'wrong'):''}" data-p="${k}" ${checked?'disabled':''}><span class="k">${k+1}</span><span>${esc(b.items[i])}</span></button>`).join(''):'<p class="hint" style="margin:0">Пока пусто</p>'}</div>
      ${pool.length?`<div class="sub">Шаги</div><div class="pool">${pool.map(i=>`<button class="it" data-q="${i}"><span class="k">·</span><span>${esc(b.items[i])}</span></button>`).join('')}</div>`:''}
      <div class="row">${checked?'<button class="btn ghost sm" data-act="retry">Попробовать ещё раз</button>':`<button class="btn" data-act="check" ${pool.length?'disabled':''}>Проверить</button>`}</div>
      <div class="fb"></div>`;
    if (!checked){
      el.querySelectorAll('[data-q]').forEach(x => x.onclick = () => { const i=+x.dataset.q; pool=pool.filter(p=>p!==i); placed.push(i); draw(false); });
      el.querySelectorAll('[data-p]').forEach(x => x.onclick = () => { const k=+x.dataset.p; const i=placed[k]; placed.splice(k,1); pool.push(i); draw(false); });
      const cb = el.querySelector('[data-act=check]');
      cb.onclick = () => { const correct = placed.every((i,k)=>i===k); complete(b.id, correct, {placed:placed.slice()}, cb); draw(true); fb(correct); updStatus(m); };
    } else el.querySelector('[data-act=retry]').onclick = () => { placed=[]; pool=shuffle(b.items.map((_,i)=>i)); draw(false); };
  }
  function fb(correct){
    const f = el.querySelector('.fb'); f.className = 'fb show '+(correct?'ok':'no');
    f.innerHTML = `<b>${correct?'Верно!':'Порядок нарушен.'}</b>${correct?'':'Правильно: '+b.items.map((t,i)=>`${i+1}) ${esc(t)}`).join('; ')+'. '}${esc(b.explain)}`;
  }
  const st = S.tasks[b.id];
  if (st && st.done){ placed = st.placed||[]; pool=[]; draw(true); fb(st.correct); } else draw(false);
}

/* ----- sort / true-false ----- */
function mountSort(b, m){
  const el = $('#t-'+b.id);
  let ans = {};
  const st = S.tasks[b.id];
  if (st && st.done) ans = Object.assign({}, st.ans);
  function draw(){
    const all = Object.keys(ans).length === b.items.length;
    el.classList.toggle('solved', !!(S.tasks[b.id]&&S.tasks[b.id].done));
    el.innerHTML = `${head(b.labels.join(' / '), b.id)}<div class="q">${esc(b.q)}</div><div class="hint">${esc(b.hint||'Выберите ответ для каждого утверждения')}</div>
      <div class="srt">${b.items.map(([t,c,ex],i)=>{ const a = ans[i]; const cls = a==null?'':(a===c?'r':'w');
        return `<div class="itm ${cls}"><span>${esc(t)}</span><div class="ch">${b.labels.map((l,k)=>`<button data-i="${i}" data-k="${k}" class="${a===k?'pick':''}" ${a!=null?'disabled':''}>${esc(l)}</button>`).join('')}</div><div class="ex">${a===c?'✓ ':'✗ '}${esc(ex)}</div></div>`;}).join('')}</div>
      ${all?`<div class="row"><button class="btn ghost sm" data-act="retry">Пройти ещё раз</button></div>`:''}`;
    el.querySelectorAll('.ch button:not([disabled])').forEach(x => x.onclick = () => {
      ans[+x.dataset.i] = +x.dataset.k; draw();
      if (Object.keys(ans).length === b.items.length){
        const n = b.items.filter(([t,c],i)=>ans[i]===c).length;
        complete(b.id, n===b.items.length, {ans}, el.querySelector('.q'), Math.round(10*n/b.items.length));
        toast(`Верно: ${n} из ${b.items.length}`); draw(); updStatus(m);
      }
    });
    const r = el.querySelector('[data-act=retry]'); if (r) r.onclick = () => { ans = {}; draw(); };
  }
  draw();
}

/* ----- spot the violations ----- */
function mountSpot(b, m){
  const el = $('#t-'+b.id);
  const st = S.tasks[b.id];
  let found = st && st.done ? Object.keys(SPOTS) : [], misses = 0;
  el.innerHTML = `${head('Найди нарушения', b.id)}<div class="q">Найдите 5 нарушений на картинке</div>
    <div class="hint">Нажимайте на места, где сотрудник нарушил правила показа. Найдено: <b id="spN">${found.length}</b> из 5</div>
    <div class="scene">${SCENE}</div><div class="spotlist" id="spL"></div>
    <div class="row" id="spR"></div>`;
  const sv = el.querySelector('svg');
  function mark(v, i){
    const s = SPOTS[v], ns = 'http://www.w3.org/2000/svg';
    const g = document.createElementNS(ns,'g');
    g.innerHTML = `<circle class="found-ring" cx="${s.x}" cy="${s.y}" r="34"/><circle class="found-b" cx="${s.x+30}" cy="${s.y-30}" r="15"/><text class="found-n" x="${s.x+30}" y="${s.y-23}" text-anchor="middle">${i}</text>`;
    sv.appendChild(g);
  }
  function list(){
    $('#spL').innerHTML = found.map((v,i)=>`<div>${i+1}. ${esc(SPOTS[v].t)}</div>`).join('');
    $('#spN').textContent = found.length;
    const done = found.length===5;
    $('#spR').innerHTML = done ? '' : (misses>=2 ? '<button class="btn ghost sm" id="spGive">Показать оставшиеся</button>' : '');
    const g = $('#spGive'); if (g) g.onclick = () => {
      Object.keys(SPOTS).forEach(v => { if (!found.includes(v)){ found.push(v); mark(v, found.length); } });
      list(); complete(b.id, false, {}, el.querySelector('.q'), 3); updStatus(m);
    };
  }
  found.forEach((v,i)=>mark(v,i+1)); list();
  sv.querySelectorAll('.hs').forEach(h => h.onclick = (e) => {
    e.stopPropagation(); const v = h.dataset.v;
    if (found.includes(v)) return;
    found.push(v); mark(v, found.length); list(); toast('Нашли: ' + SPOTS[v].t);
    if (found.length===5){ complete(b.id, misses<3, {}, el.querySelector('.q'), Math.max(4, 10-misses*2)); toast('Все 5 нарушений найдены!'); updStatus(m); }
  });
  sv.querySelectorAll('.dec').forEach(d => d.onclick = (e) => { e.stopPropagation(); if (found.length<5){ misses++; list(); } toast(d.dataset.d); });
  sv.onclick = () => { if (found.length<5){ misses++; list(); toast('Здесь нарушений нет — ищите дальше'); } };
}

/* ----- scenario ----- */
function mountScenario(b, m){
  const el = $('#t-'+b.id);
  let step = 0, errors = 0, log = [], fbMsg = null;
  const st = S.tasks[b.id];
  if (st && st.done){ step = b.steps.length; log = b.steps.map(s=>s.opts.find(o=>o[1])[2]); }
  function draw(){
    el.classList.toggle('solved', !!(S.tasks[b.id]&&S.tasks[b.id].done));
    const dots = `<div class="dots">${b.steps.map((_,i)=>`<i class="${i<step?'d':(i===step?'c':'')}"></i>`).join('')}</div>`;
    let h = `${head('Ситуация', b.id)}<div class="q">${esc(b.q)}</div>${dots}`;
    h += `<div class="log">${log.map(t=>`<div>✓ ${esc(t)}</div>`).join('')}</div>`;
    if (step < b.steps.length){
      const s = b.steps[step];
      h += `<div class="story"><div class="who">Шаг ${step+1} из ${b.steps.length}</div>${esc(s.text)}</div>
        <div class="opts">${s.opts.map((o,i)=>`<button class="opt radio" data-i="${i}"><span class="box"></span><span>${esc(o[0])}</span></button>`).join('')}</div>`;
      if (fbMsg) h += `<div class="fb show no"><b>Не лучший вариант.</b>${esc(fbMsg)} Попробуйте другой.</div>`;
    } else {
      h += `<div class="fb show ok"><b>Ситуация разобрана!</b>${errors===0?'Все решения верные с первой попытки.':'Ошибок по ходу: '+errors+'. Главное — теперь вы знаете правильный порядок действий.'}</div>
        <div class="row"><button class="btn ghost sm" data-act="retry">Пройти ситуацию ещё раз</button></div>`;
    }
    el.innerHTML = h;
    el.querySelectorAll('.opt').forEach(o => o.onclick = () => {
      const opt = b.steps[step].opts[+o.dataset.i];
      if (opt[1]){ log.push(opt[2]); step++; fbMsg = null;
        if (step===b.steps.length){ complete(b.id, errors===0, {}, el.querySelector('.q'), Math.max(4, 10-errors*2)); draw(); updStatus(m); return; }
      } else { errors++; fbMsg = opt[2]; o.classList.add('wrong'); setTimeout(draw, 350); return; }
      draw();
    });
    const r = el.querySelector('[data-act=retry]'); if (r) r.onclick = () => { step=0; errors=0; log=[]; fbMsg=null; draw(); };
  }
  draw();
}

/* ----- final test ----- */
let FT = null;
function renderFinal(){
  const missing = MODULES.filter(m=>!modDone(m));
  if (FT) return drawFinalQ();
  if (!profileOk()){
    $('#main').innerHTML = `<div class="mod"><div class="mhead"><div><div class="kicker">Итоговый тест</div><h2>Сначала представьтесь</h2><p class="lead">Чтобы результат теста засчитался, укажите на стартовой странице фамилию и имя и выберите сеть.</p></div><div class="ill">${ILL.final}</div></div><div class="row"><button class="btn amber" id="toStart">Заполнить данные</button></div></div>`;
    $('#toStart').onclick = () => go('start'); return;
  }
  let h = `<div class="mod"><div class="mhead"><div><div class="kicker">Итоговый тест</div><h2>Проверьте себя</h2>
    <p class="lead">${FINAL.length} вопросов в случайном порядке, один правильный ответ в каждом. Для успешного прохождения нужно ответить верно минимум на ${Math.ceil(FINAL.length*PASS)} из ${FINAL.length}.</p></div><div class="ill">${ILL.final}</div></div>`;
  if (missing.length) h += `<div class="block callout"><b>Рекомендуем сначала пройти модули:</b> ${missing.map(m=>esc(m.title)).join(', ')}. Тест можно начать и сейчас.</div>`;
  if (S.final) h += resultHTML(S.final);
  h += `<div class="row"><button class="btn amber" id="ftStart">${S.final?'Пройти тест ещё раз':'Начать тест'}</button></div></div>`;
  $('#main').innerHTML = h;
  $('#ftStart').onclick = () => { FT = {order: shuffle(FINAL.map((_,i)=>i)), i:0, answers:[], t0:Date.now()}; drawFinalQ(); };
}
function drawFinalQ(){
  const qi = FT.order[FT.i], q = FINAL[qi];
  let chosen = null;
  const oo = shuffle(q.opts.map((_,i)=>i));
  $('#main').innerHTML = `<div class="mod"><div class="row" style="justify-content:space-between;margin:0"><div class="kicker" style="margin:0">Итоговый тест · вопрос ${FT.i+1} из ${FINAL.length}</div><span class="timer" id="tmr"></span></div>
    <div class="bar" style="background:var(--line);margin:12px 0 24px"><i style="width:${FT.i/FINAL.length*100}%"></i></div>
    <div class="task"><div class="q">${esc(q.q)}</div><div class="hint">Выберите один вариант</div>
    <div class="opts">${oo.map(i=>`<button class="opt radio" data-i="${i}"><span class="box"></span><span>${esc(q.opts[i])}</span></button>`).join('')}</div>
    <div class="row"><button class="btn" id="ftNext" disabled>${FT.i===FINAL.length-1?'Завершить тест':'Далее →'}</button></div></div></div>`;
  const tick = () => { const t = $('#tmr'); if (!t || !FT) return; const s = Math.floor((Date.now()-FT.t0)/1000); t.textContent = '⏱ ' + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
  tick(); clearInterval(drawFinalQ._iv); drawFinalQ._iv = setInterval(tick, 1000);
  document.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel');
    chosen = +o.dataset.i; $('#ftNext').disabled = false;
  });
  $('#ftNext').onclick = () => {
    FT.answers.push({q:qi, a:chosen}); FT.i++;
    if (FT.i < FINAL.length) { drawFinalQ(); window.scrollTo(0,0); return; }
    clearInterval(drawFinalQ._iv);
    const score = FT.answers.filter(x=>FINAL[x.q].ok===x.a).length;
    const secs = Math.floor((Date.now()-FT.t0)/1000);
    const passed = score/FINAL.length >= PASS;
    const firstPass = passed && !(S.final && S.final.passed);
    S.final = {score, total:FINAL.length, passed, answers:FT.answers, secs, date:new Date().toLocaleDateString('ru-RU')};
    FT = null; save();
    if (firstPass){ S.pts += score*5; save(); }
    S.attempts = (S.attempts||0) + 1; save();
    sendEvent('final', {score, total:FINAL.length, passed, secs,
      answers: S.final.answers.map(x => ({id:x.q, q:FINAL[x.q].q, ok: FINAL[x.q].ok===x.a})),
      wrongNums: S.final.answers.filter(x => FINAL[x.q].ok!==x.a).map(x => x.q+1).sort((a,b)=>a-b)});
    renderNav(); renderFinal(); window.scrollTo(0,0);
  };
}
function resultHTML(r){
  const wrong = r.answers.filter(x=>FINAL[x.q].ok!==x.a);
  const time = r.secs!=null ? ` · время ${Math.floor(r.secs/60)}:${String(r.secs%60).padStart(2,'0')}` : '';
  let h = '';
  if (r.passed){
    h += `<div class="block cert"><div class="ill">${ILL.final}</div><div class="kicker">Обучение пройдено</div>
      <div class="score" style="color:var(--ok)">${r.score} / ${r.total}</div>
      <h3>Стандарты безопасности ювелирного салона</h3>
      <div class="who">${esc(S.name||'Сотрудник')}</div>
      <p>${S.brand?'Сеть '+esc(S.brand)+' · ':''}${esc(r.date)}${time} · ★ ${S.pts} баллов</p>
      ${API_URL?'<p class="status">✓ Результат передан в общую таблицу обучения.</p>':''}
      <p class="status">Покажите этот экран директору магазина. Следующий шаг — ознакомление с <a href="${DOCS_URL}" target="_blank" rel="noopener">Регламентом №1.1</a> под подпись и практика в салоне.</p></div>`;
  } else {
    h += `<div class="block callout" style="border-left-color:var(--bad)"><b style="color:var(--bad)">Тест не пройден: ${r.score} из ${r.total}.</b> Нужно минимум ${Math.ceil(r.total*PASS)}. Повторите модули по вопросам ниже и пройдите тест ещё раз.</div>`;
  }
  if (wrong.length){
    h += `<div class="block"><h3>Разбор ошибок</h3><div class="review">${wrong.map(x=>{const q=FINAL[x.q];return `<div class="r"><b>${esc(q.q)}</b><small>Ваш ответ: ${esc(q.opts[x.a])}</small><small style="color:var(--ok)">Правильно: ${esc(q.opts[q.ok])}</small></div>`;}).join('')}</div></div>`;
  }
  return h;
}

/* ======================= INIT ======================= */
(function(){ const h = location.hash.slice(1); if (VIEWS.includes(h)) S.view = h; })();
window.addEventListener('hashchange', () => { const h=location.hash.slice(1); if (VIEWS.includes(h) && h!==S.view){ S.view=h; render(); } });
render();
flushQueue();
</script>
